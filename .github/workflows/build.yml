name: Build Gun Heat VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S GunHeat/GunHeat -B build -G "Visual Studio 17 2022" -A x64 -DCOPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: GunHeat-VST3
          path: build/GunHeat_artefacts/Release/VST3
